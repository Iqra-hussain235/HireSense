version: '3.8'

services:
  hiresense-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hiresense-ai
    ports:
      - "8501:8501"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - APP_NAME=HireSense AI
      - APP_VERSION=1.0.0
      - DEBUG=False
      - OCR_LANGUAGE=en
      - OCR_GPU=False
    volumes:
      - ./uploads:/app/uploads
      - ./temp:/app/temp
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - hiresense-network

networks:
  hiresense-network:
    driver: bridge
